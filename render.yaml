services:
  - type: pgsql
    name: fintask-postgres
    ipAllowList: []
    plan: free
    databaseName: fintask
    databaseUser: fintask

  - type: web
    name: fintask
    runtime: docker
    plan: standard
    maxShutdownDelaySeconds: 30
    depends:
      - name: fintask-postgres
        type: pgsql
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      # Database connection
      - key: DB_CONNECTION
        value: pgsql
      # IMPORTANT: Set these manually in Render dashboard after deployment
      # - key: DB_HOST
      #   value: YOUR_POSTGRES_HOST_HERE
      # - key: DB_PORT
      #   value: "5432"
      # - key: DB_DATABASE
      #   value: fintask
      # - key: DB_USERNAME
      #   value: fintask
      # - key: DB_PASSWORD
      #   value: YOUR_PASSWORD_HERE

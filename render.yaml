services:
  - type: web
    name: fintask
    runtime: php
    plan: standard
    buildCommand: |
      composer install --no-dev
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    preDeployCommand: "php artisan migrate --force"
    staticPublishPath: public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie

services:
  - type: mysql
    name: fintask-mysql
    ipAllowList: []
    plan: free
    databaseName: laravel
    databaseUser: laravel

  - type: web
    name: fintask
    runtime: docker
    plan: standard
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      # Database variables - will be injected by Render
      - key: DB_CONNECTION
        value: mysql
      # IMPORTANT: Set these manually in Render dashboard after deployment
      # - key: DB_HOST
      #   value: YOUR_MYSQL_HOST_HERE
      # - key: DB_PORT
      #   value: "3306"
      # - key: DB_DATABASE
      #   value: laravel
      # - key: DB_USERNAME
      #   value: laravel
      # - key: DB_PASSWORD
      #   value: YOUR_PASSWORD_HERE
